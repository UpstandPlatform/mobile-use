name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./cmd/mobile-use
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable-bootstrap-password
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U postgres' --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create the isolated runtime database
        env:
          PGPASSWORD: disposable-bootstrap-password
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE mobileuse LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'disposable-runtime-password'"
          createdb -h 127.0.0.1 -U postgres --owner=mobileuse mobileuse
      - run: go test ./... -count=1
        env:
          MOBILE_USE_TEST_POSTGRES: postgres://mobileuse:disposable-runtime-password@127.0.0.1:5432/mobileuse?sslmode=disable
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :companion:assembleDebug :companion:lintDebug :control:assembleDebug :fixture:assembleDebug
        working-directory: android
