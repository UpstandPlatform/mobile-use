openapi: 3.1.0
info:
  title: mobile-use API
  version: 1.0.0
security:
  - bearer: []
paths:
  /v1/me:
    get:
      operationId: identity
      responses:
        '200': {description: Current identity and workspace}
  /v1/devices:
    get:
      operationId: devicesList
      responses:
        '200': {description: Device inventory in the caller's scope}
  /v1/devices/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      operationId: deviceCapabilities
      responses:
        '200': {description: Device capabilities and current availability}
    put:
      operationId: enrollDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Enrollment'}
      responses:
        '200': {description: Updated enrollment}
  /v1/sessions:
    get:
      operationId: sessionsList
      responses:
        '200': {description: Pending and active sessions}
    post:
      operationId: startSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartSession'}
      responses:
        '201': {description: Pending approval or active session}
  /v1/sessions/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      operationId: sessionStatus
      responses:
        '200': {description: Current session state}
  /v1/sessions/{id}/{verb}:
    parameters:
      - {$ref: '#/components/parameters/id'}
      - name: verb
        in: path
        required: true
        schema: {type: string, enum: [approve, deny, presence, pause, resume, takeover, end]}
    post:
      operationId: changeSession
      responses:
        '200': {description: Updated session state}
  /v1/sessions/{id}/operations:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      operationId: runOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Operation'}
      responses:
        '200':
          description: Operation result. Check state and error before using the response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Result'}
        default:
          description: Request or authorization failed
  /v1/sessions/{id}/video:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      operationId: getVideoNetworkConfiguration
      responses:
        '200': {description: Authorized ICE servers, short-lived TURN credentials, and the transport policy}
    post:
      operationId: openVideoViewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, sdp]
              properties:
                type: {const: offer}
                sdp: {type: string, maxLength: 65536}
      responses:
        '201': {description: WebRTC answer and viewer ID}
  /v1/sessions/{id}/video/{viewer}:
    parameters:
      - {$ref: '#/components/parameters/id'}
      - name: viewer
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: closeVideoViewer
      responses:
        '204': {description: Viewer closed}
  /v1/audit:
    get:
      operationId: auditList
      responses:
        '200': {description: Recent workspace audit metadata}
  /v1/audit/page:
    get:
      operationId: auditPage
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Stable workspace audit page with total counts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
  /v1/system/info:
    get:
      operationId: systemInfo
      responses:
        '200': {description: Daemon mode, companion endpoints, ADB readiness, and MCP commands}
  /v1/companion/pairing:
    post:
      operationId: createCompanionPairing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                origin: {type: string, format: uri}
                auto_enroll: {type: boolean}
                grant_agents: {type: array, items: {type: string}}
      responses:
        '201': {description: Companion pairing code, origin, fingerprint, and QR URI}
  /v1/companion/pairing/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      operationId: companionPairingStatus
      responses:
        '200': {description: Current pairing status (waiting, paired, or expired)}
  /v1/companion/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    delete:
      operationId: revokeCompanion
      responses:
        '200': {description: Companion unpaired and revoked}
  /v1/local/adb/discover:
    get:
      operationId: localAdbDiscover
      responses:
        '200': {description: Workstation ADB availability and mDNS wireless debugging services}
  /v1/local/adb/pair:
    post:
      operationId: localAdbPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, code]
              properties:
                address: {type: string}
                code: {type: string}
      responses:
        '200': {description: Wireless debugging pairing result}
  /v1/local/adb/connect:
    post:
      operationId: localAdbConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: {type: string}
      responses:
        '200': {description: Wireless debugging connection result}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string}}
  schemas:
    Capability:
      type: string
      enum: [screen, ui_tree, touch, text, apps, browser, camera, microphone, multi_touch]
    Enrollment:
      type: object
      required: [label, owner, profile]
      properties:
        label: {type: string, maxLength: 128}
        owner: {type: string}
        profile: {enum: [personal, dedicated]}
        enabled: {type: boolean}
        grants:
          type: array
          items:
            type: object
            required: [subject, capabilities]
            properties:
              subject: {type: string}
              capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
    StartSession:
      type: object
      required: [device_id, purpose, capabilities]
      properties:
        device_id: {type: string}
        purpose: {type: string, minLength: 3, maxLength: 256}
        capabilities: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Capability'}}
    AuditPage:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
    AuditEvent:
      type: object
      required: [at, actor, event]
      properties:
        at: {type: string, format: date-time}
        actor: {type: string}
        event: {type: string}
        device: {type: string}
        session: {type: string}
        code: {type: string}
    Point:
      type: object
      required: [x, y]
      properties:
        x: {type: number, minimum: 0, exclusiveMaximum: 1}
        y: {type: number, minimum: 0, exclusiveMaximum: 1}
    TouchPath:
      type: object
      required: [start, end]
      properties:
        start: {$ref: '#/components/schemas/Point'}
        end: {$ref: '#/components/schemas/Point'}
    UINode:
      type: object
      required: [id, bounds, enabled, visible, clickable]
      properties:
        id: {type: string}
        parent_id: {type: string}
        role: {type: string}
        label: {type: string}
        hint: {type: string}
        resource_id: {type: string}
        bounds:
          type: object
          required: [x, y, width, height]
          properties:
            x: {type: integer}
            y: {type: integer}
            width: {type: integer, minimum: 0}
            height: {type: integer, minimum: 0}
        enabled: {type: boolean}
        visible: {type: boolean}
        clickable: {type: boolean}
        long_clickable: {type: boolean}
        focusable: {type: boolean}
        editable: {type: boolean}
        checkable: {type: boolean}
        checked: {type: boolean}
        selected: {type: boolean}
        scrollable: {type: boolean}
        protected: {type: boolean}
        focused: {type: boolean}
    Operation:
      type: object
      required: [kind]
      properties:
        id: {type: string, description: Supply a unique ID when dispatching a mutation or requesting a sensor.}
        kind: {enum: [observe, act, apps_list, app_launch, app_terminate, app_install, app_reset, browser_contexts, browser_observe, browser_act, sensor_request, sensor_status, artifact_get]}
        app_id: {type: string}
        maintenance:
          type: object
          required: [artifact_id, confirm]
          properties:
            artifact_id: {type: string}
            confirm: {type: string, description: The operation verb and catalog ID separated by one space.}
        observe:
          type: object
          properties:
            screen: {type: boolean}
            tree: {type: boolean}
            wait_for: {type: string}
            timeout_ms: {type: integer, minimum: 0, maximum: 8000}
        action:
          type: object
          required: [type, frame_id]
          properties:
            type: {enum: [tap, double_tap, long_press, swipe, drag, scroll, fling, pinch, rotate, two_finger_tap, multi_touch, type, key]}
            frame_id: {type: string}
            node_id: {type: string}
            point: {$ref: '#/components/schemas/Point'}
            end: {$ref: '#/components/schemas/Point'}
            second_point: {$ref: '#/components/schemas/Point'}
            second_end: {$ref: '#/components/schemas/Point'}
            paths:
              type: array
              minItems: 1
              maxItems: 5
              items: {$ref: '#/components/schemas/TouchPath'}
            direction: {enum: [up, down, left, right]}
            duration_ms: {type: integer, minimum: 0, maximum: 3000}
            text: {type: string}
            key: {enum: [home, back, overview, enter, backspace, tab, escape, menu, dpad_up, dpad_down, dpad_left, dpad_right, volume_up, volume_down, volume_mute, notification_shade, quick_settings]}
        browser:
          type: object
          required: [context_id]
          properties:
            context_id: {type: string}
            document_id: {type: string}
            type: {enum: [navigate, click, fill, scroll]}
            url: {type: string, format: uri}
            selector: {type: string}
            text: {type: string}
            delta_y: {type: integer}
        sensor:
          type: object
          required: [type]
          properties:
            type: {enum: [camera, microphone]}
            request_id: {type: string}
            duration_seconds: {type: integer, minimum: 0, maximum: 15}
    Result:
      type: object
      required: [id, state]
      properties:
        id: {type: string}
        state: {enum: [succeeded, failed, executing, outcome_unknown]}
        observation:
          type: object
          properties:
            frame_id: {type: string}
            captured_at: {type: string, format: date-time}
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
            orientation: {type: string}
            app_id: {type: string}
            image: {type: object}
            nodes: {type: array, items: {$ref: '#/components/schemas/UINode'}}
            partial: {type: array, items: {type: string}}
        apps: {type: array, items: {type: string}}
        contexts: {type: array, items: {type: object}}
        page: {type: object}
        sensor: {type: object}
        artifact:
          type: object
          required: [mime, data]
          properties:
            mime: {enum: [image/png, image/jpeg, audio/wav]}
            data: {type: string, contentEncoding: base64}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
